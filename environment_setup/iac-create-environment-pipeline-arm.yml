pr: none
trigger: none

variables:
- group: mlops_dev_variables

stages:
- stage: Dev
  displayName: Provision Dev resources
  jobs:
  - job: Provision_Dev
    displayName: Provision Dev resources
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: Bash@3
      name: GenParams
      displayName: Generate ARM parameters file
      inputs:
        targetType: 'inline'
        script: |
          cat <<EOF > $(Build.SourcesDirectory)/environment_setup/cloud-environment.parameters.json
          {
            "$schema": "https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#",
            "contentVersion": "1.0.0.0",
            "parameters": {
              "workspace":        { "value": "$(WORKSPACE_NAME)" },
              "location":         { "value": "$(LOCATION)" },
              "baseName":         { "value": "$(BASE_NAME)" }
            }
          }
          EOF
    - task: AzureResourceGroupDeployment@2
      displayName: Deploy OH resources to Azure
      inputs:
        azureSubscription: '$(AZURE_RM_SVC_CONNECTION)'
        action: 'Create Or Update Resource Group'
        resourceGroupName: '$(RESOURCE_GROUP)'
        location: '$(LOCATION)'
        templateLocation: 'Linked artifact'
        csmFile: '$(Build.SourcesDirectory)/environment_setup/cloud-environment.json'
        csmParametersFile: '$(Build.SourcesDirectory)/environment_setup/cloud-environment.parameters.json'
        deploymentMode: 'Incremental'