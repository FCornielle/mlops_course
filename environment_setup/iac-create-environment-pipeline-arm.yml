pr: none
trigger: none

variables:
- group: mlops_dev_variables

stages:
- stage: Dev
  displayName: Provision Dev resources
  jobs:
  - job: Provision_Dev
    displayName: Provision Dev resources
    pool:
      vmImage: 'ubuntu-latest'
    timeoutInMinutes: 0

    steps:
    # 1) Generar dinámicamente parámetros para la plantilla ARM
    - task: Bash@3
      name: GenArmParams
      displayName: Generate ARM parameters file
      inputs:
        targetType: 'inline'
        script: |
          cat <<EOF > $(Build.SourcesDirectory)/environment_setup/cloud-environment.parameters.json
          {
            "$schema": "https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#",
            "contentVersion": "1.0.0.0",
            "parameters": {
              "workspaceName":  { "value": "$(WORKSPACE_NAME)" },
              "location":       { "value": "$(LOCATION)" },
              "storageAccountName":     { "value": "$(BASE_NAME)sa" },
              "keyVaultName":           { "value": "$(BASE_NAME)-kv" },
              "applicationInsightsName":{ "value": "$(BASE_NAME)-ai" },
              "containerRegistryName":  { "value": "$(BASE_NAME)acr" },
              "sku":          { "value": "basic" }
            }
          }
          EOF

    # 2) Desplegar usando la plantilla + archivo de parámetros
    - task: AzureResourceGroupDeployment@2
      displayName: Deploy OH resources to Azure
      inputs:
        azureSubscription: '$(AZURE_RM_SVC_CONNECTION)'
        action: 'Create Or Update Resource Group'
        resourceGroupName: '$(RESOURCE_GROUP)'
        location: '$(LOCATION)'
        templateLocation: 'Linked artifact'
        csmFile: '$(Build.SourcesDirectory)/environment_setup/cloud-environment.json'
        csmParametersFile: '$(Build.SourcesDirectory)/environment_setup/cloud-environment.parameters.json'
        deploymentMode: 'Incremental'
