pr: none
trigger: none

variables:
- group: mlops_dev_variables

stages:
- stage: Dev
  displayName: Provision Dev resources
  jobs:
  - job: Provision_Dev
    displayName: Provision Dev resources
    pool:
      vmImage: 'ubuntu-latest'
    timeoutInMinutes: 0
    steps:
    - task: AzureResourceGroupDeployment@2
      displayName: Deploy OH resources to Azure
      inputs:
        azureSubscription: '$(AZURE_RM_SVC_CONNECTION)'
        action: 'Create Or Update Resource Group'
        resourceGroupName: '$(RESOURCE_GROUP)'
        location: '$(LOCATION)'
        templateLocation: 'Linked artifact'
        csmFile: '$(Build.SourcesDirectory)/environment_setup/cloud-environment.json'
        csmParametersFile: '$(Build.SourcesDirectory)/environment_setup/cloud-environment.parameters.json'
        deploymentMode: 'Incremental'
      displayName: 'Deploy OH resources to Azure'
